<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#352419"/>
      <stop offset="70%" stop-color="#241710"/>
      <stop offset="100%" stop-color="#120D0A"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0AA"/>
      <stop offset="50%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#8B4500"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Board Mat Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#5C3E21" stroke-width="12"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Kolam Triangular Grid Overlay -->
  <polygon points="256,70 100,410 412,410" fill="none" stroke="#D2B48C" stroke-width="8" stroke-opacity="0.5"/>
  <line x1="256" y1="70" x2="256" y2="410" stroke="#D2B48C" stroke-width="8" stroke-opacity="0.5"/>
  <line x1="178" y1="240" x2="334" y2="240" stroke="#D2B48C" stroke-width="8" stroke-opacity="0.5"/>
  <line x1="139" y1="325" x2="373" y2="325" stroke="#D2B48C" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Center Tiger Icon (Golden Diamond) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <circle cx="0" cy="0" r="88" fill="url(#goldGrad)" stroke="#FFF0AA" stroke-width="6"/>
    <rect x="-38" y="-38" width="76" height="76" rx="10" transform="rotate(45)" fill="#651C05" stroke="#FFE082" stroke-width="5"/>
    <circle cx="0" cy="0" r="14" fill="#FFD54F"/>
  </g>
</svg>
